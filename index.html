<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cotización — DistriDAGO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0f;
  --card:rgba(255,255,255,.04);
  --card2:rgba(255,255,255,.07);
  --brd:rgba(255,255,255,.08);
  --brd2:rgba(255,255,255,.14);
  --tx:#f0f0f5;
  --tx2:rgba(240,240,245,.55);
  --tx3:rgba(240,240,245,.3);
  --acc:#7c3aed;--acc2:#8b5cf6;
  --green:#30d158;--green-bg:rgba(48,209,88,.1);--green-brd:rgba(48,209,88,.25);
  --red:#ff453a;--red-bg:rgba(255,69,58,.1);
  --amber:#ffd60a;--amber-bg:rgba(255,214,10,.08);--amber-brd:rgba(255,214,10,.22);
  --blur:saturate(180%) blur(20px);
  --r:12px;--r2:18px;
}
html{height:100%;background:var(--bg)}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--tx);
  min-height:100dvh;
  overflow-x:hidden;
}

/* ── Background vivo ── */
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.15}
.orb1{width:400px;height:400px;background:var(--acc);top:-100px;left:-100px}
.orb2{width:300px;height:300px;background:#0a84ff;bottom:-50px;right:-80px}
.orb3{width:200px;height:200px;background:var(--green);top:50%;left:50%;transform:translate(-50%,-50%)}

/* ── Dot grid ── */
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:28px 28px}

/* ── Header ── */
.header{
  position:sticky;top:0;z-index:100;
  padding:env(safe-area-inset-top) 20px 0;
  background:rgba(10,10,15,.8);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--brd);
}
.header-inner{
  display:flex;align-items:center;gap:12px;
  padding:14px 0 14px;
}
.logo{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
  box-shadow:0 4px 16px rgba(124,58,237,.4);
}
.brand{flex:1}
.brand-name{font-size:15px;font-weight:700;letter-spacing:-.3px}
.brand-sub{font-size:10px;color:var(--tx3);letter-spacing:.8px;text-transform:uppercase;margin-top:1px}
.status-badge{
  font-size:10px;font-weight:600;
  padding:4px 10px;border-radius:20px;
  background:var(--amber-bg);color:var(--amber);
  border:1px solid var(--amber-brd);
  white-space:nowrap;
}
.status-badge.sent{background:var(--green-bg);color:var(--green);border-color:var(--green-brd)}

/* ── Main ── */
main{position:relative;z-index:1;padding:20px 16px 100px}

/* ── Info card ── */
.info-card{
  background:var(--card);
  border:1px solid var(--brd);
  border-radius:var(--r2);
  padding:16px;
  margin-bottom:20px;
  backdrop-filter:var(--blur);
}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0}
.info-label{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px}
.info-value{font-size:13px;font-weight:600;color:var(--tx);text-align:right}

/* ── Section title ── */
.sec-title{
  font-size:11px;font-weight:700;color:var(--tx3);
  text-transform:uppercase;letter-spacing:.8px;
  margin-bottom:10px;margin-top:4px;
}

/* ── Producto card ── */
.prod-card{
  background:var(--card);
  border:1px solid var(--brd);
  border-radius:var(--r);
  padding:14px;
  margin-bottom:8px;
  transition:border-color .2s,background .2s;
}
.prod-card.has-price{
  border-color:rgba(48,209,88,.3);
  background:rgba(48,209,88,.04);
}
.prod-card.no-stock{
  border-color:rgba(255,69,58,.25);
  background:rgba(255,69,58,.04);
  opacity:.7;
}
.prod-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.prod-name{font-size:13px;font-weight:600;color:var(--tx);line-height:1.35;flex:1}
.prod-ref{font-size:10px;color:var(--tx3);font-family:'DM Mono',monospace;margin-top:3px}
.prod-cant{
  font-size:11px;font-weight:700;
  padding:4px 10px;border-radius:20px;
  background:rgba(124,58,237,.15);color:#c4b5fd;
  border:1px solid rgba(124,58,237,.25);
  white-space:nowrap;flex-shrink:0;
}
.prod-cant-input{
  width:52px;padding:5px 4px;
  font-size:13px;font-family:'DM Mono',monospace;font-weight:600;
  background:rgba(124,58,237,.1);color:#c4b5fd;
  border:1.5px solid rgba(124,58,237,.3);
  border-radius:10px;text-align:center;outline:none;
  -webkit-appearance:none;
}
.prod-cant-input:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(124,58,237,.2)}
.add-prod-wrap{margin-top:16px;margin-bottom:8px}
.add-prod-input{
  width:100%;padding:12px 14px;
  font-size:14px;font-family:'DM Sans',sans-serif;
  background:var(--card);border:1.5px solid var(--brd);
  border-radius:var(--r);color:var(--tx);outline:none;
  transition:border-color .15s;
}
.add-prod-input:focus{border-color:var(--acc2)}
.add-prod-input::placeholder{color:var(--tx3)}
.add-prod-btn{
  margin-top:8px;width:100%;padding:12px;
  font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;
  background:var(--card2);border:1.5px solid var(--brd);
  border-radius:var(--r);color:var(--acc2);cursor:pointer;
  transition:background .15s,border-color .15s;
}
.add-prod-btn:active{background:rgba(124,58,237,.1);border-color:var(--acc)}
.remove-prod-btn{
  background:none;border:none;color:var(--red);font-size:16px;
  cursor:pointer;padding:4px 8px;opacity:.6;transition:opacity .15s;
}
.remove-prod-btn:active{opacity:1}

/* ── Inputs precio ── */
.prod-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.input-wrap{position:relative}
.input-label{font-size:9px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.price-input{
  width:100%;
  padding:10px 12px;
  font-size:16px;font-family:'DM Mono',monospace;font-weight:500;
  background:rgba(255,255,255,.06);
  border:1.5px solid var(--brd);
  border-radius:10px;
  color:var(--tx);
  outline:none;
  transition:border-color .15s,box-shadow .15s;
  -webkit-appearance:none;
}
.price-input:focus{
  border-color:var(--acc2);
  box-shadow:0 0 0 3px rgba(124,58,237,.2);
  background:rgba(139,92,246,.06);
}
.price-input.filled{border-color:var(--green-brd);background:rgba(48,209,88,.04)}
.price-input::placeholder{color:var(--tx3)}

/* Checkbox sin stock */
.no-stock-wrap{
  display:flex;align-items:center;gap:8px;
  margin-top:8px;cursor:pointer;
  padding:8px 10px;
  background:rgba(255,69,58,.06);
  border:1px solid rgba(255,69,58,.15);
  border-radius:8px;
}
.no-stock-chk{
  width:18px;height:18px;border-radius:5px;
  border:1.5px solid rgba(255,69,58,.4);
  background:transparent;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .15s;
}
.no-stock-chk.on{background:var(--red-bg);border-color:var(--red)}
.no-stock-lbl{font-size:12px;color:rgba(255,150,144,.8);font-weight:500}

/* ── Notas generales ── */
.notes-wrap{margin-top:16px}
.notes-input{
  width:100%;
  padding:12px 14px;
  font-size:14px;font-family:'DM Sans',sans-serif;
  background:var(--card);
  border:1.5px solid var(--brd);
  border-radius:var(--r);
  color:var(--tx);
  resize:none;min-height:80px;
  outline:none;
  transition:border-color .15s;
}
.notes-input:focus{border-color:var(--acc2)}
.notes-input::placeholder{color:var(--tx3)}

/* ── Submit ── */
.submit-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(10,10,15,.9);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--brd);
  padding:14px 16px;
  padding-bottom:max(14px,env(safe-area-inset-bottom));
  z-index:200;
}
.submit-btn{
  width:100%;padding:16px;
  font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  border:none;border-radius:14px;
  color:#fff;cursor:pointer;
  box-shadow:0 4px 20px rgba(124,58,237,.5);
  transition:transform .15s,opacity .15s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.submit-btn:active{transform:scale(.98);opacity:.9}
.submit-btn:disabled{background:var(--card2);box-shadow:none;color:var(--tx3);cursor:not-allowed}

/* ── Progress ── */
.progress-bar-wrap{height:3px;background:var(--brd);border-radius:2px;margin:10px 0 16px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:2px;transition:width .3s}

/* ── Estados ── */
.empty-state,.success-state,.loading-state,.error-state{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:50dvh;gap:16px;
  text-align:center;padding:20px;
}
.state-ico{font-size:48px;margin-bottom:4px}
.state-title{font-size:20px;font-weight:700}
.state-sub{font-size:14px;color:var(--tx2);line-height:1.5;max-width:300px}

/* ── Spinner ── */
.spin{width:32px;height:32px;border:2px solid rgba(124,58,237,.2);border-top-color:var(--acc2);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── Summary ── */
.summary{
  background:var(--card2);
  border:1px solid var(--brd);
  border-radius:var(--r);
  padding:12px 14px;
  margin-top:16px;
  display:flex;justify-content:space-between;align-items:center;
}
.summary-label{font-size:11px;color:var(--tx3)}
.summary-value{font-size:14px;font-weight:700;color:var(--tx);font-family:'DM Mono',monospace}
</style>
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>
<div class="bg-grid"></div>

<div class="header">
  <div class="header-inner">
    <div class="logo">🏗️</div>
    <div class="brand">
      <div class="brand-name">DistriDAGO</div>
      <div class="brand-sub">Solicitud de cotización</div>
    </div>
    <div class="status-badge" id="statusBadge">Pendiente</div>
  </div>
</div>

<main id="mainContent">
  <div class="loading-state">
    <div class="spin"></div>
    <div class="state-sub">Cargando solicitud...</div>
  </div>
</main>

<div class="submit-bar" id="submitBar" style="display:none">
  <button class="submit-btn" id="submitBtn" onclick="enviarCotizacion()">
    <span>Enviar cotización</span> <span>→</span>
  </button>
</div>

<script>
// ── CONFIG SUPABASE ──
const SB_URL='https://djqewlbziatqatclysio.supabase.co';
const SB_KEY='sb_publishable_Viv0eIItecZDUIe_bJij6Q_0JdW8hyN';

let solicitud=null;
let respuestas={};
let noStock={};
let productosExtra=[];

// ── Helpers ──
async function sbFetch(url,opts={},retries=3){
  for(let i=0;i<retries;i++){
    try{
      const r=await fetch(url,opts);
      if(!r.ok){
        const txt=await r.text().catch(()=>'');
        if(r.status>=500&&i<retries-1){await new Promise(t=>setTimeout(t,1000*(i+1)));continue}
        throw new Error(`HTTP ${r.status}: ${txt||r.statusText}`);
      }
      return r;
    }catch(e){
      if(e.message.startsWith('HTTP '))throw e;
      if(i<retries-1){await new Promise(t=>setTimeout(t,1000*(i+1)));continue}
      throw e;
    }
  }
}
async function sbGet(table,filter=''){
  const r=await sbFetch(`${SB_URL}/rest/v1/${table}?${filter}&limit=1`,{
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Accept-Profile':'repo'}
  });
  const d=await r.json();
  return Array.isArray(d)?d[0]:null;
}
async function sbInsert(table,data){
  const r=await sbFetch(`${SB_URL}/rest/v1/${table}`,{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation','Content-Profile':'repo','Accept-Profile':'repo'},
    body:JSON.stringify(data)
  });
  return r.json();
}
async function sbUpdate(table,filter,data){
  const r=await sbFetch(`${SB_URL}/rest/v1/${table}?${filter}`,{
    method:'PATCH',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Content-Profile':'repo','Accept-Profile':'repo'},
    body:JSON.stringify(data)
  });
  return true;
}

// ── Leer TOKEN del URL ──
function getToken(){
  const p=window.location.pathname.split('/');
  return p[p.length-1]||new URLSearchParams(window.location.search).get('t');
}

// ── Cargar solicitud ──
async function cargar(){
  const token=getToken();
  if(!token||token==='cotizar'||token==='index.html'){
    mostrarError('Link inválido','Este enlace de cotización no es válido. Solicita uno nuevo a DistriDAGO.');
    return;
  }
  try{
    solicitud=await sbGet('cotizaciones_solicitudes',`token=eq.${token}`);
    if(!solicitud){mostrarError('No encontrado','Esta cotización no existe o ya expiró.');return}
    if(solicitud.estado==='respondida'){mostrarEnviado();return}
    renderForm();
  }catch(e){
    console.error('Error cargando cotización:',e);
    const detalle=e.message&&e.message.startsWith('HTTP ')?e.message:'Sin conexión al servidor';
    mostrarError('Error de conexión',`No se pudo cargar la cotización.<br><small style="opacity:.6">${detalle}</small>`);
    document.querySelector('.error-state')?.insertAdjacentHTML('beforeend',
      `<button onclick="location.reload()" style="margin-top:20px;padding:12px 32px;background:var(--acc);color:#000;border:none;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer">Reintentar</button>`);
  }
}

// ── Render formulario ──
function renderForm(){
  const prods=solicitud.productos||[];
  const venc=solicitud.fecha_vencimiento?new Date(solicitud.fecha_vencimiento).toLocaleDateString('es-CO'):null;

  document.getElementById('mainContent').innerHTML=`
    <!-- Info de la solicitud -->
    <div class="info-card">
      <div class="info-row">
        <span class="info-label">Para</span>
        <span class="info-value">${solicitud.proveedor_nombre||'—'}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Solicitado por</span>
        <span class="info-value">${solicitud.creado_por||'DistriDAGO'}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Referencia</span>
        <span class="info-value" style="font-family:'DM Mono',monospace;font-size:12px">${solicitud.token.slice(0,8).toUpperCase()}</span>
      </div>
      ${venc?`<div class="info-row">
        <span class="info-label">Válida hasta</span>
        <span class="info-value" style="color:#ffd60a">${venc}</span>
      </div>`:''}
    </div>

    <!-- Instrucción -->
    <p style="font-size:13px;color:var(--tx2);margin-bottom:14px;line-height:1.5">
      Ingresa el <strong style="color:var(--tx)">precio unitario</strong> y el <strong style="color:var(--tx)">tiempo de entrega</strong> de cada producto. Puedes <strong style="color:var(--tx)">ajustar cantidades</strong> y <strong style="color:var(--tx)">agregar productos</strong> adicionales. Si no manejas un producto, marca "Sin stock".
    </p>

    <!-- Progreso -->
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>
    <p style="font-size:11px;color:var(--tx3);margin-bottom:16px" id="progressTxt">0 de ${prods.length} completados</p>

    <div class="sec-title" id="prodCount">${prods.length} productos</div>

    <div id="prodList">
      ${prods.map((p,i)=>renderProd(p,i)).join('')}
    </div>

    <!-- Agregar productos -->
    <div class="add-prod-wrap">
      <div class="sec-title" style="margin-bottom:8px">Agregar producto</div>
      <input class="add-prod-input" id="addProdNombre" placeholder="Nombre del producto...">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px">
        <div>
          <div class="input-label">Cantidad</div>
          <input type="number" class="price-input" id="addProdCant" placeholder="Cant." inputmode="numeric" min="1" style="font-size:14px">
        </div>
        <div>
          <div class="input-label">Precio unit.</div>
          <input type="number" class="price-input" id="addProdPrecio" placeholder="$ 0" inputmode="numeric" style="font-size:14px">
        </div>
        <div>
          <div class="input-label">Entrega (dias)</div>
          <input type="number" class="price-input" id="addProdEntrega" placeholder="ej: 3" inputmode="numeric" min="0" style="font-size:14px">
        </div>
      </div>
      <button class="add-prod-btn" onclick="agregarProducto()">+ Agregar producto</button>
    </div>

    <div id="extraProdList"></div>

    <div class="notes-wrap">
      <div class="input-label" style="margin-bottom:6px">Notas adicionales (opcional)</div>
      <textarea class="notes-input" id="notasGen" placeholder="Descuentos por volumen, condiciones de pago, observaciones generales..."></textarea>
    </div>

    <!-- Resumen -->
    <div class="summary" id="summaryBox" style="display:none">
      <div>
        <div class="summary-label">Total estimado</div>
        <div style="font-size:10px;color:var(--tx3);margin-top:2px">Basado en cantidades</div>
      </div>
      <div class="summary-value" id="summaryTotal">$0</div>
    </div>
  `;

  document.getElementById('submitBar').style.display='block';
  actualizarProgreso();
}

function renderProd(p,i){
  return`<div class="prod-card" id="pc-${i}">
    <div class="prod-top">
      <div>
        <div class="prod-name">${p.nombre}</div>
        <div class="prod-ref">${p.sku||'—'}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <input type="number" class="prod-cant-input" id="cant-${i}"
          value="${p.cantidadRef||1}"
          min="1" inputmode="numeric"
          oninput="onCantChange(${i},this)">
        <span style="font-size:11px;color:var(--tx3)">${p.unidad||'und'}</span>
      </div>
    </div>
    <div class="prod-inputs">
      <div>
        <div class="input-label">Precio unitario (COP)</div>
        <input type="number" class="price-input" id="precio-${i}"
          placeholder="$ 0"
          inputmode="numeric"
          oninput="onPrecioChange(${i},this)"
          onfocus="this.select()">
      </div>
      <div>
        <div class="input-label">Entrega (dias)</div>
        <input type="number" class="price-input" id="entrega-${i}"
          placeholder="ej: 3"
          inputmode="numeric"
          min="0"
          oninput="onEntregaChange(${i},this)">
      </div>
    </div>
    <div class="no-stock-wrap" onclick="toggleNoStock(${i})" id="ns-${i}">
      <div class="no-stock-chk" id="nsc-${i}"></div>
      <div class="no-stock-lbl">Sin stock / No manejamos</div>
    </div>
  </div>`;
}

function onCantChange(i,el){
  const v=Number(el.value)||0;
  solicitud.productos[i].cantidadRef=v;
  actualizarTotal();
}
function onPrecioChange(i,el){
  const v=parseFloat(el.value)||0;
  if(!respuestas[i])respuestas[i]={};
  respuestas[i].precio=v;
  el.className='price-input'+(v>0?' filled':'');
  document.getElementById('pc-'+i).classList.toggle('has-price',v>0||noStock[i]);
  actualizarProgreso();
  actualizarTotal();
}
function onEntregaChange(i,el){
  if(!respuestas[i])respuestas[i]={};
  respuestas[i].entrega=parseInt(el.value)||0;
}
function agregarProducto(){
  const nombre=(document.getElementById('addProdNombre')?.value||'').trim();
  if(!nombre){alert('Ingresa el nombre del producto');return}
  const cant=parseInt(document.getElementById('addProdCant')?.value)||1;
  const precio=parseFloat(document.getElementById('addProdPrecio')?.value)||0;
  const entrega=parseInt(document.getElementById('addProdEntrega')?.value)||0;
  productosExtra.push({nombre,cantidad:cant,precio,entregaDias:entrega});
  document.getElementById('addProdNombre').value='';
  document.getElementById('addProdCant').value='';
  document.getElementById('addProdPrecio').value='';
  document.getElementById('addProdEntrega').value='';
  renderExtraProds();actualizarProgreso();actualizarTotal();updProdCount();
}
function removeExtra(idx){
  productosExtra.splice(idx,1);
  renderExtraProds();actualizarProgreso();actualizarTotal();updProdCount();
}
function renderExtraProds(){
  const el=document.getElementById('extraProdList');if(!el)return;
  if(!productosExtra.length){el.innerHTML='';return}
  el.innerHTML=`<div class="sec-title" style="margin-top:12px">Productos agregados (${productosExtra.length})</div>`+
    productosExtra.map((p,i)=>`<div class="prod-card has-price" style="display:flex;align-items:center;gap:10px">
      <div style="flex:1">
        <div class="prod-name">${p.nombre}</div>
        <div class="prod-ref">${p.cantidad} und · ${p.precio?'$'+Math.round(p.precio).toLocaleString('es-CO'):'Sin precio'}${p.entregaDias?' · '+p.entregaDias+'d':''}</div>
      </div>
      <button class="remove-prod-btn" onclick="removeExtra(${i})">✕</button>
    </div>`).join('');
}
function updProdCount(){
  const el=document.getElementById('prodCount');
  if(el)el.textContent=((solicitud?.productos||[]).length+productosExtra.length)+' productos';
}
function toggleNoStock(i){
  noStock[i]=!noStock[i];
  const chk=document.getElementById('nsc-'+i);
  const card=document.getElementById('pc-'+i);
  const precio=document.getElementById('precio-'+i);
  const entrega=document.getElementById('entrega-'+i);
  chk.classList.toggle('on',noStock[i]);
  card.classList.toggle('no-stock',noStock[i]);
  card.classList.toggle('has-price',noStock[i]||(parseFloat(precio?.value)||0)>0);
  precio.disabled=noStock[i];
  entrega.disabled=noStock[i];
  if(!respuestas[i])respuestas[i]={};
  respuestas[i].sinStock=noStock[i];
  if(noStock[i]){respuestas[i].precio=0}
  actualizarProgreso();
}
function actualizarProgreso(){
  const prods=solicitud.productos||[];
  const total=prods.length;
  let completados=0;
  prods.forEach((_,i)=>{
    const precio=parseFloat(document.getElementById('precio-'+i)?.value)||0;
    if(precio>0||noStock[i])completados++;
  });
  const pct=total>0?Math.round((completados/total)*100):0;
  const bar=document.getElementById('progressBar');
  const txt=document.getElementById('progressTxt');
  if(bar)bar.style.width=pct+'%';
  if(txt)txt.textContent=`${completados} de ${total} completados`;
  const btn=document.getElementById('submitBtn');
  if(btn)btn.disabled=completados===0;
}
// ── Cantidad efectiva: lee del input, fallback al cantidadRef original. Nunca default 1. ──
function _cantEfect(i,p){
  const inp=document.getElementById('cant-'+i);
  const v=inp?Number(inp.value):NaN;
  if(Number.isFinite(v)&&v>0)return v;
  return Number(p&&p.cantidadRef)||0;
}
function actualizarTotal(){
  const prods=solicitud.productos||[];
  let total=0;let hayPrecios=false;
  prods.forEach((p,i)=>{
    const precio=Number(document.getElementById('precio-'+i)?.value)||0;
    const cant=_cantEfect(i,p);
    if(precio>0&&cant>0){total+=precio*cant;hayPrecios=true}
  });
  productosExtra.forEach(p=>{
    const cant=Number(p.cantidad)||0;
    if(p.precio>0&&cant>0){total+=p.precio*cant;hayPrecios=true}
  });
  const box=document.getElementById('summaryBox');
  const tot=document.getElementById('summaryTotal');
  if(box)box.style.display=hayPrecios?'flex':'none';
  if(tot)tot.textContent='$'+Math.round(total).toLocaleString('es-CO');
}

// ── Enviar ──
async function enviarCotizacion(){
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.innerHTML='<div class="spin" style="width:20px;height:20px;border-width:2px"></div><span>Enviando...</span>';

  const prods=solicitud.productos||[];
  const productosCotizados=prods.map((p,i)=>({
    nombre:p.nombre,
    sku:p.sku||'',
    unidad:p.unidad||'und',
    cantidadRef:_cantEfect(i,p),
    cantidadOriginal:p.cantidadRef,
    precio:noStock[i]?0:(parseFloat(document.getElementById('precio-'+i)?.value)||0),
    entregaDias:parseInt(document.getElementById('entrega-'+i)?.value)||null,
    sinStock:noStock[i]||false,
  }));
  productosExtra.forEach(pe=>{
    productosCotizados.push({
      nombre:pe.nombre,sku:'',unidad:'und',
      cantidadRef:pe.cantidad||1,
      precio:pe.precio||0,
      entregaDias:pe.entregaDias||null,
      sinStock:false,
      agregadoPorProveedor:true,
    });
  });

  const notas=document.getElementById('notasGen')?.value?.trim()||'';

  try{
    await sbInsert('cotizaciones_respuestas',{
      solicitud_id:solicitud.id,
      token:solicitud.token,
      proveedor_nombre:solicitud.proveedor_nombre,
      productos_cotizados:productosCotizados,
      notas,
      fecha_respuesta:new Date().toISOString()
    });
    await sbUpdate('cotizaciones_solicitudes',`token=eq.${solicitud.token}`,{
      estado:'respondida',
      fecha_respuesta:new Date().toISOString()
    });
    mostrarEnviado();
  }catch(e){
    btn.disabled=false;
    btn.innerHTML='<span>Enviar cotización</span><span>→</span>';
    alert('Error al enviar. Verifica tu conexión e intenta de nuevo.');
  }
}

function mostrarEnviado(){
  document.getElementById('statusBadge').className='status-badge sent';
  document.getElementById('statusBadge').textContent='✓ Enviada';
  document.getElementById('submitBar').style.display='none';
  document.getElementById('mainContent').innerHTML=`
    <div class="success-state">
      <div class="state-ico">✅</div>
      <div class="state-title">¡Cotización enviada!</div>
      <div class="state-sub">
        Recibimos tu cotización para <strong>${solicitud?.proveedor_nombre||'DistriDAGO'}</strong>.<br><br>
        El equipo de compras la revisará y se pondrá en contacto contigo pronto.
      </div>
      <div style="margin-top:20px;padding:16px 20px;background:var(--card);border:1px solid var(--brd);border-radius:14px;text-align:center">
        <div style="font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px">Referencia</div>
        <div style="font-size:18px;font-family:'DM Mono',monospace;font-weight:600;margin-top:4px">${(solicitud?.token||'').slice(0,8).toUpperCase()}</div>
      </div>
    </div>`;
}
function mostrarError(titulo,msg){
  document.getElementById('mainContent').innerHTML=`
    <div class="error-state">
      <div class="state-ico">⚠️</div>
      <div class="state-title">${titulo}</div>
      <div class="state-sub">${msg}</div>
    </div>`;
}

cargar();
</script>
